    function copiarTexto() {
      const texto = document.getElementById("pantallaTexto").value || "";

      // Copiar al portapapeles (API moderna)
      navigator.clipboard.writeText(texto)
        .then(() => {
          alert("Texto copiado al portapapeles ✅");

          // Llamar a función adicional para compatibilidad extendida
          copiarTextoConActivacion();

          // Agregar línea al historial con timestamp
          const linea = `${obtenerTimestamp()} ${texto}`;
          if (!window.historial) window.historial = []; // inicializar si no existe
          window.historial.push(linea);

          // Actualizar panel visual
          const hv = document.getElementById("historialVisual");
          if (hv) hv.innerText = window.historial.join("\n");

          // Guardar en memoria local
          localStorage.setItem("historicoContenido", window.historial.join("\n"));
        })
        .catch(err => {
          console.warn("Error al copiar:", err);
          alert("No se pudo copiar el texto automáticamente.");
        });
    }

    function copiarTextoConActivacion() {
      const historial = localStorage.getItem("historicoContenido") || "";

      const ultima = lineas[lineas.length - 1] || "";

      // Crear textarea temporal
      const temp = document.createElement("textarea");
      temp.value = ultima;
      temp.setAttribute("readonly", "");
      temp.style.position = "fixed";
      temp.style.left = "-9999px";
      document.body.appendChild(temp);

      temp.select();
      const exitoso = document.execCommand("copy");
      document.body.removeChild(temp);

      if (exitoso) {

      } else {

      }

    // Interpretacion mirada instantanea para funcion pausa
    function interpretarMiradaInstantanea(modelo) {
      if (ultimoYNormalizado === null) return 'x';
      const pArriba = probabilidadNormal(ultimoYNormalizado, modelo.arriba.media, modelo.arriba.std);
      const pAbajo = probabilidadNormal(ultimoYNormalizado, modelo.abajo.media, modelo.abajo.std);
      if (pArriba > pAbajo && pArriba > 0.001) return '1';
      if (pAbajo > pArriba && pAbajo > 0.001) return '0';
      return 'x';
    }
    
    //Borrar todo con la mirada
    async function confirmarBorradoPorMirada() {
      estadoDiv.textContent = "🗑️ ¿Deseas borrar todo el texto? Mira hacia arriba para confirmar, o hacia abajo para cancelar.";

      let acumuladoArriba = 0;
      let acumuladoAbajo = 0;
      const intervalo = 100;
      const umbral = 4000;

      await reproducirPalabra(`¿Confirmas que quieres borrar todo?`);


      while (acumuladoArriba < umbral && acumuladoAbajo < umbral) {
        const direccion = interpretarMiradaInstantanea(modeloCalibrado);
        console.log(`🧭 Dirección mirada: ${direccion}`);

        if (direccion === '1') {

    function probabilidadNormal(x, mu, sigma) {
      if (sigma === 0) return 0;
      const coef = 1 / (Math.sqrt(2 * Math.PI) * sigma);
      const exponencial = Math.exp(-((x - mu) ** 2) / (2 * sigma ** 2));
      return coef * exponencial;
    }

    function calcularYNormalizado(landmarks) {
      try {
        const yCeja = landmarks[10].y;
        const yBarbilla = landmarks[152].y;
        const alturaRostro = Math.abs(yBarbilla - yCeja);
        if (alturaRostro < 0.1) return null;
        const ys = irisIndices.map(i => landmarks[i].y);
        const yPromedio = ys.reduce((a, b) => a + b, 0) / ys.length;
        return (yPromedio - yCeja) / alturaRostro;
      } catch {
        return null;
      }
    }

    async function calibrarProbabilistico() {
      const arriba = await capturarMuestras("arriba");
      const abajo = await capturarMuestras("abajo");
      if (arriba.length < 5 || abajo.length < 5) return null;
      const media = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
      const std = arr => Math.sqrt(arr.map(x => (x - media(arr)) ** 2).reduce((a, b) => a + b, 0) / arr.length);
      return {
        arriba: { media: media(arriba), std: std(arriba) },
        abajo: { media: media(abajo), std: std(abajo) }
      };
    }

    async function interpretarMiradaUnaVez(modelo) {
      const yVals = [];
      const inicio = Date.now();
      while (Date.now() - inicio < 1020) {
        if (ultimoYNormalizado !== null) yVals.push(ultimoYNormalizado);
        await esperar(34);
      }
      if (yVals.length === 0) return 'x';
      const yMedio = yVals.reduce((a, b) => a + b, 0) / yVals.length;
      const pArriba = probabilidadNormal(yMedio, modelo.arriba.media, modelo.arriba.std);
      const pAbajo = probabilidadNormal(yMedio, modelo.abajo.media, modelo.abajo.std);
      if (pArriba > pAbajo && pArriba > 0.01) return '1';
      if (pAbajo > pArriba && pAbajo > 0.01) return '0';
      return 'x';
    }

          estadoDiv.textContent = `❓ ${opcion.pregunta}`;
          await reproducirPalabra(opcion.pregunta);
          const respuesta = await interpretarMiradaUnaVez(modelo);
          
          if (enPausa) break; // si se activó pausa durante esta ronda, salta

          console.log(`${opcion.pregunta} →`, respuesta);

          if (respuesta === '1') {
            await opcion.bloque(modelo);
            break; // 🔁 Salir del ciclo de preguntas tras recorrer un bloque
          }
        }

        // 🔁 Reinicia automáticamente
        estadoDiv.textContent = "🔄 Reiniciando ciclo...";
        await esperar(500);
      }
    }
    // fin de bloques de colores

    //Funcion que recorre todos los bloques
    async function recorrerBloqueConPregunta(modelo, preguntaInicial, letras, bloqueId) {
      const bloque = document.getElementById(bloqueId);
      const teclas = Array.from(bloque.querySelectorAll(".tecla"));

      for (let ronda = 0; ronda < 10; ronda++) {
        estadoDiv.textContent = `❓ ${preguntaInicial}`;
        await reproducirPalabra(preguntaInicial);
        const respuesta = await interpretarMiradaUnaVez(modelo);
        if (respuesta !== '1') {
          estadoDiv.textContent = "⏭️ Saltando ronda.";
          await esperar(500);
          continue;
        }

        for (let i = 0; i < letras.length; i++) {
          const letra = letras[i];
          const tecla = teclas[i];

          if (cursorActivo) cursorActivo.remove();
          cursorActivo = document.createElement("div");
          cursorActivo.className = "cursor";
          cursorActivo.textContent = "⬤";
          tecla.appendChild(cursorActivo);

          estadoDiv.textContent = `❓ ¿${letra === ' ' ? 'espacio' : letra.toUpperCase()}?`;
          await reproducirPalabra(`¿${letra === ' ' ? 'espacio' : letra.toUpperCase()}?`);
          const respuestaLetra = await interpretarMiradaUnaVez(modelo);

          if (respuestaLetra === '1') {
            //if (letra === 'borrar') borrarUltimo();
            //else presionarTecla(letra);
            tecla.style.transform = "scale(0.95)";
            tecla.style.boxShadow = "inset 0 0 5px rgba(0,0,0,0.3)";
            estadoDiv.textContent = `✅ ${letra === ' ' ? 'Espacio' : letra.toUpperCase()} seleccionado`;
            await esperar(500);
            switch (letra) {
              case 'borrar':
                borrarUltimo();
                break;
              case 'vaciar':
                await confirmarBorradoPorMirada();
                break;
              case 'leer':
                leerTextoCompleto(); // Asegúrate de tener esta función definida
                break;
              case 'pausa':
                await activarPausa(); // Asegúrate de tener esta función definida
                break;
              case 'enter':
                presionarTecla('\n');
                break;
              case 'coma':
                presionarTecla(','); // Asegúrate de tener esta función definida
                break;
              case 'pregunta':
                presionarTecla('?'); // Asegúrate de tener esta función definida
                break;
              case 'punto':
                presionarTecla('.'); // Asegúrate de tener esta función definida
                break;  
              case 'exclamacion':
                presionarTecla('!'); // Asegúrate de tener esta función definida        
                break;
              case 'nuevalinea':
                presionarTecla('\n'); // Asegúrate de tener esta función definida        
                break;
              case 'para':
                presionarTecla('en fin'); // Asegúrate de tener esta función definida        
                break;
              case 'hola':
                presionarTecla('como estás?'); // Asegúrate de tener esta función definida        
                break;
              case 'escuche':
                presionarTecla('hoy escuché'); // Asegúrate de tener esta función definida        
                break;
              case 'lei':
                presionarTecla('escuché en un libro increible'); // Asegúrate de tener esta función definida        
                break;
              case 'bebe':
                presionarTecla('Señor Don Principe Felipe'); // Asegúrate de tener esta función definida        
                break;
              case 'harta':
                presionarTecla('estoy harta'); // Asegúrate de tener esta función definida        
                break;
              case 'quiero':
                presionarTecla('I just wanna tell....'); // Asegúrate de tener esta función definida        
                break;
              case 'alzar':
                presionarTecla('I feel so deeply'); // Asegúrate de tener esta función definida        
                break;
              case 'chao':
                presionarTecla('I love You, good luck!!!'); // Asegúrate de tener esta función definida        
                break;
              case 'acontilde':
                presionarTecla('á'); // Asegúrate de tener esta función definida        
                break;
              case 'econtilde':
                presionarTecla('é'); // Asegúrate de tener esta función definida        
                break;
              case 'icontilde':
                presionarTecla('í'); // Asegúrate de tener esta función definida        
                break;
              case 'ocontilde':
                presionarTecla('ó'); // Asegúrate de tener esta función definida        
                break;
              case 'ucontilde':
                presionarTecla('ú'); // Asegúrate de tener esta función definida        
                break;
              case 'feliz':
                presionarTecla('😊'); // Asegúrate de tener esta función definida        
                break;
              case 'beso':
                presionarTecla('😘'); // Asegúrate de tener esta función definida        
                break;
              case 'respirar':
                presionarTecla('😮‍💨'); // Asegúrate de tener esta función definida        
                break;
              case 'emoción':
                presionarTecla('🥹'); // Asegúrate de tener esta función definida        
                break;
              case 'signo':
                await recorrerBloqueTomate(modelo);
                break;
              case 'numero':
                await recorrerBloqueCian(modelo);
                break;
              default:
                presionarTecla(letra); // Para caracteres normales

            }

            tecla.style.transform = "";
            tecla.style.boxShadow = "";
            cursorActivo.remove();
            return; // 🔁 Salir del recorrido tras selección
          }
        }
      }

      estadoDiv.textContent = "✅ Secuencia completada";
    }

    // fin funcion que recorre todos los bloques
    // 🔧 CONFIGURACIÓN DE MEDIAPIPE Y CÁMARA
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      //console.log("Y normalizado:", ultimoYNormalizado);

      if (results.multiFaceLandmarks) {
        const landmarks = results.multiFaceLandmarks[0];
        drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, { color: '#00FF00', lineWidth: 1 });
        drawLandmarks(canvasCtx, landmarks, { color: '#FF0000', radius: 1 });

        ultimoYNormalizado = calcularYNormalizado(landmarks);
        //console.log("Y normalizado:", ultimoYNormalizado);

        if (esperaRostro && !flujoIniciado) {
          flujoIniciado = true;
          estadoDiv.textContent = "✅ Rostro detectado. Calibrando...";
          calibrarProbabilistico().then(modelo => {
            if (!modelo) {
              estadoDiv.textContent = "🚫 Calibración fallida.";
              return;
            }
            modeloCalibrado = modelo;
            estadoDiv.textContent = "✅ Calibración completada. Iniciando teclado...";
            
            cicloInteractivoPorMirada(modeloCalibrado);
          });
        }

        if (modeloCalibrado && ultimoYNormalizado !== null) {
          const y = ultimoYNormalizado;
          const pArriba = probabilidadNormal(y, modeloCalibrado.arriba.media, modeloCalibrado.arriba.std);
          const pAbajo = probabilidadNormal(y, modeloCalibrado.abajo.media, modeloCalibrado.abajo.std);
          if (!enPausa && pArriba > pAbajo && pArriba > 0.01) {
            console.log("✅ Mirada hacia arriba detectada → confirmando selección");
            confirmarSeleccionPorMirada();
          }
        }
      } else {
        estadoDiv.textContent = "😐 Rostro no detectado";
        ultimoYNormalizado = null;
      }

      canvasCtx.restore();
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
      },
      width: 480,
      height: 360
    });

    camera.start();
  </script>
